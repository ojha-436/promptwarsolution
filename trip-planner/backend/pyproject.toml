[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "A", "C4", "RET", "SIM"]
# S101: asserts are fine (esp. in tests).
# N818: domain exceptions (GeminiUnavailable/GeminiTransient) read better
#       without a forced "Error" suffix — the stdlib itself ships SystemExit,
#       KeyboardInterrupt, StopIteration, etc.
ignore = ["S101", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/", "build/"]

# Third-party SDKs that ship no type stubs / py.typed marker. Without this,
# strict mode floods with import-untyped noise for code we do not own.
[[tool.mypy.overrides]]
module = [
    "google.*",
    "firebase_admin.*",
    "googlemaps.*",
    "slowapi.*",
]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
